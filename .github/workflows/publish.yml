name: Publish
on:
  push:
    tags:
      - v*

jobs:
  tests:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
