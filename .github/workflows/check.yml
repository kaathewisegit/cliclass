name: CI
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Setup
        run: |
          uv venv
          uv sync --extra dev
          uv pip install .

      - name: Run checks
        run: |
          uv run toolkit.py check
          uv run toolkit.py test
